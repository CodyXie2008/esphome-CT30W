# ESPHome Secrets Template
# 这个文件是一个模板，不要直接修改。复制到secrets.yaml后再填入实际值

# WiFi设置
hz_iot_wifi_name: "你的WiFi名称"
hz_iot_wifi_password: "你的WiFi密码"

# OTA更新密码
ota_password: "你的OTA密码"

# API加密密钥
api_encryption_key: "你的32字节加密密钥"

# 备用AP密码
fallback_ap_password: "你的备用AP密码"

# 使用说明：
# 1. 将此文件复制为secrets.yaml
# 2. 替换所有占位符值为你的实际信息
# 3. 确保secrets.yaml已添加到.gitignore中，避免被提交到GitHub